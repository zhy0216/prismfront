# 包级 bunfig —— 架构 §7 覆盖率闸门的**实际生效点**（风险登记册 R-M0-2 的处置）。
#
# 为什么每个包都要有一份，而不是只在仓库根放一份：
#   bun 1.3.14 只从 **cwd** 读 `bunfig.toml`（外加 `~/.bunfig.toml`），**不往上层找**。
#   而 `turbo test` 跑各包的 `test` 脚本时 cwd 是**包目录** —— 根 bunfig 因此完全不生效。
#   三个候选方案里选了「各包各放一份」：CI 仍然只跑一条 `bunx turbo test`，
#   turbo 的按包缓存与并行都保住了。代价是这份文件要随新包复制一份。
#
# ═══════════════════════════════════════════════════════════════════════════
# ★ `coverageThreshold` 的两个反直觉行为（bun 1.3.14 实测，改之前先读）★
# ═══════════════════════════════════════════════════════════════════════════
# 1. **必须写标量，行内表会被静默忽略。**
#      coverageThreshold = 0.8            → 未达标时 exit 1 ✅ 真闸门
#      coverageThreshold = { line = 0.8 } → **静默忽略**，写成 { line = 1.0 } 也 exit 0 ❌
#    架构 §7 给的正是被忽略的行内表写法。那份文档按「逐字采用」保留未改，
#    偏离记在风险登记册 R-M0-2。
#
# 2. **标量阈值是逐文件判定，不是全局判定。**
#    实测边界卡在 0.73/0.74，恰好等于当时**最低的那个文件**（queries.ts 73.33% funcs），
#    而全局是 98.6% —— 也就是说全局达标救不了任何一个掉队的文件。
#    于是「新加一个没测到的导出函数」会直接让 CI 红，这正是想要的效果，
#    但**别按全局覆盖率去估自己达不达标**。
#
# 闸门不达标时 bun **不打印任何提示**，只有退出码 —— 别指望在日志里找报错信息。

[test]
# 相对 cwd（= 本包目录）解析，所以要回到仓库根。
preload = ["../../test-setup.ts"]
coverage = true
coverageThreshold = 0.8
