# 包级 bunfig —— 架构 §7 覆盖率闸门的**实际生效点**（风险登记册 R-M0-2 的处置）。
#
# 完整论证见 `packages/engine/bunfig.toml` 的文件头。三条要点：
#   1. bun 只从 cwd 读 bunfig，而 `turbo test` 的 cwd 是包目录 → 根 bunfig 不生效，
#      所以每个有测试的包都要有自己的一份。
#   2. `coverageThreshold` 必须写**标量**：行内表 `{ line = 0.8 }` 会被 bun 1.3.14
#      静默忽略（写成 `{ line = 1.0 }` 照样 exit 0）。架构 §7 给的就是那个坏写法。
#   3. 标量阈值**逐文件**判定，不看全局 —— 全局 99% 也救不了一个 70% 的文件。

[test]
preload = ["../../test-setup.ts"]
coverage = true
coverageThreshold = 0.8
